<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday leen 🖤</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at center, #202033, #080810);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
    font-family: "Brush Script MT", cursive;
    color: white;
}

.container {
    position: relative;
    z-index: 2;
}

.heart {
    font-size: 130px;
    animation: beat 1s infinite;
}

h1 {
    font-size: 55px;
    margin-top: 10px;
    text-shadow: 0 0 15px white;
}

.star {
    position: absolute;
    color: white;
    font-size: 20px;
    animation: twinkle 2s infinite alternate;
}

.s1 { top: 15%; left: 15%; }
.s2 { top: 25%; right: 18%; }
.s3 { bottom: 20%; left: 20%; }
.s4 { bottom: 15%; right: 15%; }
.s5 { top: 10%; left: 50%; }
.s6 { bottom: 30%; right: 45%; }

@keyframes beat {
    50% { transform: scale(1.15); }
}

@keyframes twinkle {
    from { opacity: 0.2; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1.3); }
}
</style>
</head>

<body>

<div class="star s1">✦</div>
<div class="star s2">✧</div>
<div class="star s3">✦</div>
<div class="star s4">✧</div>
<div class="star s5">✦</div>
<div class="star s6">✧</div>

<div class="container">
    <div class="heart">🖤</div>
    <h1>Happy birthday to u</h1>
</div>

</body>
</html>
